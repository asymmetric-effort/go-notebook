    <script>
      // Apply saved theme or system preference before first paint.
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #f1f5f9;
        --text-primary: #0f172a;
        --text-secondary: #1f2937;
        --text-muted: #64748b;
        --text-dimmed: #94a3b8;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --border: #e2e8f0;
        --code-bg: #1e293b;
        --code-text: #e2e8f0;
      }
      [data-theme="dark"] {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #e2e8f0;
        --text-muted: #94a3b8;
        --text-dimmed: #64748b;
        --accent: #60a5fa;
        --accent-hover: #93c5fd;
        --border: #334155;
        --code-bg: #0f172a;
        --code-text: #e2e8f0;
      }
      body {
        margin: 0;
        background-color: var(--bg-primary);
        color: var(--text-secondary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      /* Dark mode toggle */
      .dark-mode-toggle {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        background: var(--bg-secondary);
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        transition: background 0.15s, border-color 0.15s;
        flex-shrink: 0;
        color: var(--text-primary);
      }
      .dark-mode-toggle:hover { background: var(--bg-tertiary); border-color: var(--accent); }
      /* Content sections */
      .ns-section-content h1 { font-size: 1.8rem; color: var(--text-primary); margin-bottom: 1rem; }
      .ns-section-content h2 { font-size: 1.5rem; color: var(--accent); margin-top: 2rem; margin-bottom: 1rem; padding-top: 1rem; }
      .ns-section-content h3 { font-size: 1.2rem; color: var(--text-muted); margin-top: 1.5rem; }
      .ns-section-content p { margin: 0.5rem 0; }
      .ns-section-content a { color: var(--accent); text-decoration: none; }
      .ns-section-content pre { background: var(--code-bg); color: var(--code-text); padding: 12px 16px; border-radius: 6px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
      [data-theme="dark"] .ns-section-content pre { border: 1px solid var(--border); }
      .ns-section-content code { background: var(--bg-tertiary); padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
      .ns-section-content pre code { background: none; padding: 0; }
      .ns-section-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
      .ns-section-content th, .ns-section-content td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
      .ns-section-content th { background: var(--bg-secondary); font-weight: 600; }
      .ns-section-content ul, .ns-section-content ol { padding-left: 1.5rem; }
      .ns-section-content li { margin: 0.25rem 0; }
      .ns-section-content blockquote { border-left: 3px solid var(--accent); margin: 1rem 0; padding: 0.5rem 1rem; color: var(--text-muted); background: var(--bg-secondary); border-radius: 0 6px 6px 0; }
      .ns-section-content img { max-width: 100%; height: auto; }
      /* Hamburger menu */
      .nav-toggle { display: none; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 20px; cursor: pointer; color: var(--text-primary); line-height: 1; }
      .nav-links { display: flex; flex-wrap: wrap; gap: 8px; }
      /* Mobile responsive */
      @media (max-width: 768px) {
        .nav-toggle { display: block; }
        .nav-links { display: none !important; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; gap: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border); padding: 8px 20px 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nav-links.open { display: flex !important; flex-direction: column; }
        .nav-links a { padding: 10px 14px; border-radius: 6px; }
        h1 { font-size: 1.5rem !important; }
        section { padding-left: 16px !important; padding-right: 16px !important; }
        pre { font-size: 12px !important; }
        .docs-sidebar { display: none; }
      }
    </style>
  </body>
</html>
