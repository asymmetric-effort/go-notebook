name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    name: Lint, scan and coverage
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/gridstream-solutions/mcpauthd-linter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install project dependencies
        run: npm ci
      - name: Leakdetector
        run: |
          leakdetector --skip-history --format sarif --report results.sarif || true
          if [ -f results.sarif ]; then
            python3 -c "
          import json
          with open('results.sarif') as f:
              data = json.load(f)
          for run in data.get('runs', []):
              driver = run.get('tool', {}).get('driver', {})
              if driver.get('rules') is None:
                  driver['rules'] = []
          with open('results.sarif', 'w') as f:
              json.dump(data, f, indent=2)
          " || true
          fi
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: leakdetector
      - name: Govulncheck
        run: govulncheck ./...
      - name: Lint
        run: make lint
      - name: Test with coverage
        run: make test
  build-and-test:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - name: Normalize line endings
        if: runner.os == 'Windows'
        run: git add --renormalize . && git checkout -- .
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
