name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/linter:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Bun
        run: |
          if ! command -v bun >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends unzip
            curl -fsSL https://bun.sh/install | bash
          fi
          BUN_DIR="$HOME/.bun/bin"
          if [ -d "$BUN_DIR" ]; then
            echo "$BUN_DIR" >> "$GITHUB_PATH"
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: make lint
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    container:
      image: ghcr.io/${{ github.repository }}/linter:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Leakdetector
        run: |
          leakdetector --skip-history --format sarif --report results.sarif || true
          if [ -f results.sarif ]; then
            python3 -c "
          import json
          with open('results.sarif') as f:
              data = json.load(f)
          for run in data.get('runs', []):
              driver = run.get('tool', {}).get('driver', {})
              if driver.get('rules') is None:
                  driver['rules'] = []
          with open('results.sarif', 'w') as f:
              json.dump(data, f, indent=2)
          " || true
          fi
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: leakdetector
      - name: Govulncheck
        run: govulncheck ./...
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/linter:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Bun
        run: |
          if ! command -v bun >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends unzip
            curl -fsSL https://bun.sh/install | bash
          fi
          BUN_DIR="$HOME/.bun/bin"
          if [ -d "$BUN_DIR" ]; then
            echo "$BUN_DIR" >> "$GITHUB_PATH"
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test with coverage
        run: make test
  build-primary:
    name: linux/amd64
    runs-on: ubuntu-latest
    needs: [lint, scan, coverage]
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: VSCode extension tests
        run: |
          cd vscode
          bun install --ignore-scripts
          bunx tsc -p ./
          bun run ./out/test/runTests.js
  build-secondary:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-primary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v7
      - name: Normalize line endings
        if: runner.os == 'Windows'
        run: git add --renormalize . && git checkout -- .
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: VSCode extension tests
        run: |
          cd vscode
          bun install --ignore-scripts
          bunx tsc -p ./
          bun run ./out/test/runTests.js
  package:
    name: Package release
    runs-on: ubuntu-latest
    needs: [build-primary, build-secondary]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/asymmetric-effort/go-notebook/cmd/gobook/commands.version=${{ steps.version.outputs.version }}" -o dist/gobook-linux-amd64 ./cmd/gobook
      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/asymmetric-effort/go-notebook/cmd/gobook/commands.version=${{ steps.version.outputs.version }}" -o dist/gobook-linux-arm64 ./cmd/gobook
      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/asymmetric-effort/go-notebook/cmd/gobook/commands.version=${{ steps.version.outputs.version }}" -o dist/gobook-windows-amd64.exe ./cmd/gobook
      - name: Build macos/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/asymmetric-effort/go-notebook/cmd/gobook/commands.version=${{ steps.version.outputs.version }}" -o dist/gobook-darwin-arm64 ./cmd/gobook
      - name: Package .deb (linux/amd64)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PKG=dist/deb-amd64
          mkdir -p $PKG/DEBIAN $PKG/usr/bin
          cp dist/gobook-linux-amd64 $PKG/usr/bin/gobook
          chmod 755 $PKG/usr/bin/gobook
          cat > $PKG/DEBIAN/control <<CTRL
          Package: gobook
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Asymmetric Effort, LLC <engineering@asymmetric-effort.com>
          Description: Jupyter-like notebook for Go
           gobook is a Jupyter-like notebook built in Go, with Go as the cell
           language. Notebooks are CommonMark Markdown files that compile into
           standalone report binaries.
          CTRL
          sed -i 's/^          //' $PKG/DEBIAN/control
          dpkg-deb --build $PKG dist/gobook_${VERSION}_amd64.deb
      - name: Package .deb (linux/arm64)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PKG=dist/deb-arm64
          mkdir -p $PKG/DEBIAN $PKG/usr/bin
          cp dist/gobook-linux-arm64 $PKG/usr/bin/gobook
          chmod 755 $PKG/usr/bin/gobook
          cat > $PKG/DEBIAN/control <<CTRL
          Package: gobook
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: arm64
          Maintainer: Asymmetric Effort, LLC <engineering@asymmetric-effort.com>
          Description: Jupyter-like notebook for Go
           gobook is a Jupyter-like notebook built in Go, with Go as the cell
           language. Notebooks are CommonMark Markdown files that compile into
           standalone report binaries.
          CTRL
          sed -i 's/^          //' $PKG/DEBIAN/control
          dpkg-deb --build $PKG dist/gobook_${VERSION}_arm64.deb
      - name: Package .zip (windows/amd64)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd dist
          zip gobook_${VERSION}_windows_amd64.zip gobook-windows-amd64.exe
      - name: Package .zip (macos/arm64)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd dist
          zip gobook_${VERSION}_darwin_arm64.zip gobook-darwin-arm64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/gobook_${{ steps.version.outputs.version }}_amd64.deb
            dist/gobook_${{ steps.version.outputs.version }}_arm64.deb
            dist/gobook_${{ steps.version.outputs.version }}_windows_amd64.zip
            dist/gobook_${{ steps.version.outputs.version }}_darwin_arm64.zip
  deploy-site:
    name: Deploy site
    runs-on: ubuntu-latest
    needs: [build-primary, build-secondary]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build site
        run: |
          cd site
          bun install --frozen-lockfile
          bun run build
      - name: Copy CNAME
        run: cp site/CNAME site/dist/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v5
