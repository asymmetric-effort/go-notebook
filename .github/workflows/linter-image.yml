name: Linter Image
on:
  push:
    branches: [main]
    paths:
      - 'docker/linter/**'
      - '.github/workflows/linter-image.yml'
  workflow_dispatch:
jobs:
  build-and-push:
    name: Build and push linter image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/linter
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/linter:latest
            ghcr.io/${{ github.repository }}/linter:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
