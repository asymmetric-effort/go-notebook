<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';">
<title>go-notebook editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
    background: #f8f9fa;
    color: #212529;
  }
  h1 { margin-bottom: 1.5rem; font-size: 1.6rem; }
  section.cell {
    background: #fff;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  section.cell h2 { margin: 0 0 0.75rem; font-size: 1.1rem; }
  .field { display: flex; flex-direction: column; margin-bottom: 0.75rem; }
  .field label { font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; color: #495057; }
  .field input, .field select {
    padding: 0.35rem 0.5rem;
    border: 1px solid #ced4da;
    border-radius: 4px;
    font-size: 0.9rem;
  }
  .field textarea {
    padding: 0.5rem;
    border: 1px solid #ced4da;
    border-radius: 4px;
    font-size: 0.9rem;
    resize: vertical;
  }
  .field textarea.mono { font-family: monospace; }
  button {
    padding: 0.4rem 1rem;
    background: #0d6efd;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:hover { background: #0b5ed7; }
  .status { font-size: 0.85rem; min-height: 1.2em; margin: 0 0 0.75rem; }
  .status.ok { color: #198754; }
  .status.error { color: #dc3545; }
</style>
</head>
<body>
<h1>go-notebook editor</h1>
<div id="cells">Loading…</div>
<script type="module" src="/static/editor.js"></script>
</body>
</html>
