<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';">
<title>go-notebook editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
    background: #f8f9fa;
    color: #212529;
  }
  h1 { margin-bottom: 1.5rem; font-size: 1.6rem; }
  .block {
    background: #fff;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .cell-block { border-left: 4px solid #0d6efd; }
  .prose-block { border-left: 4px solid #198754; }
  .defs-block { border-left: 4px solid #6c757d; }
  .output-block { border-left: 4px solid #ffc107; opacity: 0.7; }
  .block h2, .block h3 { margin: 0 0 0.75rem; font-size: 1.1rem; }
  .prose-editor { width: 100%; min-height: 80px; font-size: 0.95rem; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 4px; resize: vertical; }
  .defs-block pre, .output-block pre { background: #f1f3f5; padding: 0.5rem; border-radius: 4px; font-size: 0.85rem; overflow-x: auto; }
  .field { display: flex; flex-direction: column; margin-bottom: 0.75rem; }
  .field label { font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; color: #495057; }
  .field input, .field select {
    padding: 0.35rem 0.5rem;
    border: 1px solid #ced4da;
    border-radius: 4px;
    font-size: 0.9rem;
  }
  .field textarea {
    padding: 0.5rem;
    border: 1px solid #ced4da;
    border-radius: 4px;
    font-size: 0.9rem;
    resize: vertical;
  }
  .field textarea.mono { font-family: monospace; }
  button {
    padding: 0.4rem 1rem;
    background: #0d6efd;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:hover { background: #0b5ed7; }
  .toolbar { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .run-all-btn { background: #198754; }
  .run-all-btn:hover { background: #157347; }
  .run-btn { background: #198754; }
  .run-btn:hover { background: #157347; }
  .btn-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .cell-output { background: #f1f3f5; padding: 0.5rem; border-radius: 4px; font-size: 0.85rem; overflow-x: auto; margin-top: 0.5rem; border-left: 3px solid #0d6efd; white-space: pre-wrap; }
  .cell-errors { border-left-color: #dc3545; background: #fff5f5; }
  .error-entry { padding: 0.25rem 0; color: #842029; }
  .error-compile { font-family: monospace; }
  .error-timeout { color: #856404; }
  .error-panic { color: #842029; font-weight: 600; }
  .cell-marker { font-size: 0.8rem; font-weight: normal; margin-left: 0.5rem; }
  .cell-block.stale { border-left-color: #ffc107; }
  .cell-block.stale .cell-marker { color: #856404; }
  .cell-block.failed { border-left-color: #dc3545; }
  .cell-block.failed .cell-marker { color: #dc3545; }
  .cell-display { margin-top: 0.5rem; }
  .display-text { background: #f8f9fa; padding: 0.5rem; border-radius: 4px; font-size: 0.9rem; border-left: 3px solid #198754; }
  .display-chart { margin: 0.5rem 0; }
  .display-chart svg { max-width: 100%; height: auto; }
  .display-image { max-width: 100%; height: auto; margin: 0.5rem 0; border-radius: 4px; }
  .diagnostics-panel { background: #fff5f5; border: 1px solid #dc3545; border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem; }
  .diagnostics-panel h3 { margin: 0 0 0.5rem; font-size: 1rem; color: #842029; }
  .diagnostic { font-size: 0.85rem; padding: 0.15rem 0; font-family: monospace; }
  .diagnostic-error { color: #842029; }
  .diagnostic-warning { color: #856404; }
  .diagnostic-info { color: #0c5460; }
  .secret-block { border-left: 4px solid #6f42c1; }
  .secret-block input[type="password"] { font-family: monospace; letter-spacing: 0.2em; }
  .insert-toolbar { display: flex; gap: 0.5rem; padding: 0.5rem 0; justify-content: center; }
  .insert-toolbar button { background: #e9ecef; color: #495057; border: 1px solid #ced4da; font-size: 0.8rem; padding: 0.25rem 0.75rem; }
  .insert-toolbar button:hover { background: #dee2e6; }
  .block-actions { display: flex; gap: 0.25rem; float: right; }
  .block-actions button { background: transparent; color: #6c757d; border: 1px solid #dee2e6; font-size: 0.75rem; padding: 0.15rem 0.5rem; }
  .block-actions .delete-btn { color: #dc3545; border-color: #dc3545; }
  .block-actions .delete-btn:hover { background: #dc3545; color: #fff; }
  .get-started { text-align: center; padding: 3rem 1rem; }
  .get-started h2 { margin-bottom: 1rem; color: #495057; }
  .get-started p { margin-bottom: 1.5rem; color: #6c757d; }
  .get-started .starter-btn { background: #198754; font-size: 1rem; padding: 0.6rem 1.5rem; margin-bottom: 1rem; }
  .status { font-size: 0.85rem; min-height: 1.2em; margin: 0 0 0.75rem; }
  .status.ok { color: #198754; }
  .status.error { color: #dc3545; }
</style>
</head>
<body>
<h1>go-notebook editor</h1>
<div id="notebook">Loading…</div>
<script type="module" src="/static/editor.js"></script>
</body>
</html>
