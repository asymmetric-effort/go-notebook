[package]
name = "typst-module"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "typst-module"
path = "src/main.rs"

[dependencies]
typst = "0.13"
typst-library = "0.13"
typst-pdf = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
png = "0.18"
comemo = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
